<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon Filmes</title>

    <link rel="icon" type="image/png" href="/imagens/logo.png">
    <link rel="stylesheet" href="Style.css">
</head>
<body>

    <header>
        <img src="/imagens/logo.png" alt="Logo do Sistema" class="logo-header">
        <h1>Pokémon Filmes</h1>
        <p>Catálogo de filmes disponíveis na API</p>
    </header>

    <main>
        <div id="tela-login" class="login-container">
            <h2>Acesso Restrito</h2>
            <p>Insira seu Token de Acesso para gerenciar o catálogo.</p>
            <input type="password" id="input-token" placeholder="Digite seu Access Token">
            
            <div style="display: flex; align-items: center; margin-bottom: 20px; width: 100%; gap: 10px;">
                <input type="checkbox" id="lembrar-senha" style="width: auto; margin: 0; cursor: pointer; transform: scale(1.2);">
                <label for="lembrar-senha" style="color: #666; font-size: 15px; cursor: pointer;">Lembrar meu token</label>
            </div>

            <button class="btn-entrar" onclick="fazerLogin()">Entrar no Sistema</button>
        </div>

        <div id="tela-home">
            <div class="controles">
                <div class="pesquisa-container">
                    <input type="text" id="input-pesquisa" placeholder="Pesquisar filme por título...">
                </div>
                <div class="botoes-acao">
                    <button class="btn-add" onclick="abrirModal()">Adicionar Filme</button>
                    <button class="btn-logout" onclick="fazerLogout()">Sair</button>
                </div>
            </div>

            <div class="titulo">
                <h2>Filmes</h2>
                <span class="contador" id="contador">Carregando...</span>
            </div>

            <div id="filmes">
                <div class="carregando">Carregando filmes...</div>
            </div>
        </div>
    </main>

    <footer>
        API de Filmes Pokémon • localhost:3000
    </footer>

    <div class="modal-overlay" id="modal-adicionar">
        <div class="modal">
            <h2>Adicionar Novo Filme</h2>
            <form id="form-filme">
                <input type="text" id="add-titulo" placeholder="Título do Filme" required>
                <input type="text" id="add-diretor" placeholder="Diretor" required>
                <input type="number" id="add-ano" placeholder="Ano de Lançamento" required>
                <input type="text" id="add-imagem" placeholder="Caminho da Imagem (ex: /imagens/novo.jpg)">
                
                <div class="modal-botoes">
                    <button type="button" class="btn-cancelar" onclick="fecharModal()">Cancelar</button>
                    <button type="submit" class="btn-salvar">Salvar Filme</button>
                </div>
            </form>
        </div>
    </div>

    <div class="modal-overlay" id="modal-editar">
        <div class="modal">
            <h2>Editar Filme</h2>
            <form id="form-editar">
                <input type="hidden" id="edit-id"> 
                
                <input type="text" id="edit-titulo" placeholder="Título do Filme" required>
                <input type="text" id="edit-diretor" placeholder="Diretor" required>
                <input type="number" id="edit-ano" placeholder="Ano de Lançamento" required>
                <input type="text" id="edit-imagem" placeholder="Caminho da Imagem (ex: /imagens/novo.jpg)">
                
                <div class="modal-botoes">
                    <button type="button" class="btn-cancelar" onclick="fecharModalEditar()">Cancelar</button>
                    <button type="submit" class="btn-salvar">Salvar Alterações</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let todosOsFilmes = [];

        // 1. VERIFICAR SESSÃO AO ABRIR
        function verificarSessao() {
            fetch('/api/perfil')
                .then(res => {
                    if (res.ok) {
                        mostrarTelaHome();
                        carregarFilmes();
                    } else {
                        mostrarTelaLogin();
                    }
                })
                .catch(() => mostrarTelaLogin());
        }

        // 2. MOSTRAR LOGIN E LER LOCALSTORAGE
        function mostrarTelaLogin() {
            document.getElementById('tela-home').style.display = 'none';
            document.getElementById('tela-login').style.display = 'flex';
            
            const tokenSalvo = localStorage.getItem('pokemonToken');
            if (tokenSalvo) {
                document.getElementById('input-token').value = tokenSalvo;
                document.getElementById('lembrar-senha').checked = true;
            }
        }

        function mostrarTelaHome() {
            document.getElementById('tela-login').style.display = 'none';
            document.getElementById('tela-home').style.display = 'block';
        }

        // 3. ENVIAR LOGIN PARA API
        function fazerLogin() {
            const token = document.getElementById('input-token').value;
            if (!token) {
                alert("Por favor, digite o Token de Acesso.");
                return;
            }

            const lembrar = document.getElementById('lembrar-senha').checked;

            fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ access_token: token })
            })
            .then(res => {
                if(res.ok) {
                    if (lembrar) {
                        localStorage.setItem('pokemonToken', token);
                    } else {
                        localStorage.removeItem('pokemonToken');
                        document.getElementById('input-token').value = ""; 
                    }
                    
                    mostrarTelaHome();
                    carregarFilmes();
                } else {
                    alert("Token inválido! Tente novamente.");
                }
            })
            .catch(err => console.error("Erro no login", err));
        }

        // 4. SAIR
        function fazerLogout() {
            fetch('/api/logout', { method: 'POST' })
            .then(res => {
                if(res.ok) {
                    mostrarTelaLogin();
                    document.getElementById('filmes').innerHTML = ''; 
                }
            })
            .catch(err => console.error("Erro no logout", err));
        }

        // 5. CARREGAR FILMES (GET)
        function carregarFilmes() {
            fetch("/filmes")
                .then(response => {
                    if (!response.ok) throw new Error("Erro ao acessar a API");
                    return response.json();
                })
                .then(filmes => {
                    todosOsFilmes = filmes; 
                    renderizarFilmes(todosOsFilmes);
                })
                .catch(erro => {
                    document.getElementById("filmes").innerHTML = `
                        <div class="erro">Não foi possível carregar os filmes. Verifique se o servidor está rodando.</div>`;
                    console.error(erro);
                });
        }

        // 6. RENDERIZAR NA TELA
        function renderizarFilmes(lista) {
            const container = document.getElementById("filmes");
            const contador = document.getElementById("contador");
            container.innerHTML = "";
            contador.textContent = `${lista.length} filmes`;

            if(lista.length === 0) {
                container.innerHTML = `<div class="carregando">Nenhum filme encontrado.</div>`;
                return;
            }

            lista.forEach(filme => {
                const card = document.createElement("div");
                card.classList.add("card");
                card.innerHTML = `
                    <div class="card-topo">
                        <img src="${filme.imagem || '/imagens/default.jpg'}" alt="${filme.titulo}">
                    </div>
                    <div class="card-conteudo">
                        <h3>${filme.titulo}</h3>
                        <div class="informacao"><span class="label">ID</span><span class="id">#${filme.id}</span></div>
                        <div class="informacao"><span class="label">Diretor</span><span class="valor">${filme.diretor}</span></div>
                        <div class="informacao"><span class="label">Ano</span><span class="valor">${filme.ano}</span></div>
                        
                        <!-- BOTÕES LADO A LADO -->
                        <div class="botoes-card">
                            <button class="btn-editar" onclick="abrirModalEditar(${filme.id})">Editar</button>
                            <button class="btn-excluir" onclick="excluirFilme(${filme.id})">Excluir</button>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // 7. PESQUISAR
        document.getElementById('input-pesquisa').addEventListener('input', (e) => {
            const termo = e.target.value.toLowerCase();
            const filmesFiltrados = todosOsFilmes.filter(filme => 
                filme.titulo.toLowerCase().includes(termo)
            );
            renderizarFilmes(filmesFiltrados);
        });

        // 8. ADICIONAR FILME (POST)
        document.getElementById('form-filme').addEventListener('submit', (e) => {
            e.preventDefault(); 
            
            const novoFilme = {
                titulo: document.getElementById('add-titulo').value,
                diretor: document.getElementById('add-diretor').value,
                ano: Number(document.getElementById('add-ano').value),
                imagem: document.getElementById('add-imagem').value
            };

            fetch('/filmes', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(novoFilme)
            })
            .then(res => {
                if (res.status === 401) {
                    alert("Acesso Negado! Sua sessão pode ter expirado.");
                    mostrarTelaLogin();
                } else if (res.ok) {
                    fecharModal();
                    document.getElementById('form-filme').reset();
                    carregarFilmes(); 
                } else {
                    alert("Erro ao adicionar o filme. Verifique os dados.");
                }
            })
            .catch(err => console.error(err));
        });

        // 9. EXCLUIR FILME (DELETE)
        function excluirFilme(id) {
            const confirmar = confirm("Tem certeza que deseja excluir este filme?");
            if (!confirmar) return;

            fetch(`/filmes/${id}`, { method: 'DELETE' })
            .then(res => {
                if (res.status === 401) {
                    alert("Acesso Negado! Sua sessão pode ter expirado.");
                    mostrarTelaLogin();
                } else if (res.ok || res.status === 204) {
                    carregarFilmes(); 
                } else {
                    alert("Erro ao excluir o filme.");
                }
            })
            .catch(err => console.error(err));
        }

        // 10. EDITAR FILME (PUT)
        document.getElementById('form-editar').addEventListener('submit', (e) => {
            e.preventDefault();
            
            const id = document.getElementById('edit-id').value;
            const filmeAtualizado = {
                titulo: document.getElementById('edit-titulo').value,
                diretor: document.getElementById('edit-diretor').value,
                ano: Number(document.getElementById('edit-ano').value),
                imagem: document.getElementById('edit-imagem').value
            };

            fetch(`/filmes/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(filmeAtualizado)
            })
            .then(res => {
                if (res.status === 401) {
                    alert("Acesso Negado! Sua sessão pode ter expirado.");
                    mostrarTelaLogin();
                } else if (res.ok) {
                    fecharModalEditar();
                    carregarFilmes();
                } else {
                    alert("Erro ao editar o filme. Verifique os dados.");
                }
            })
            .catch(err => console.error(err));
        });

        function abrirModal() { document.getElementById('modal-adicionar').style.display = 'flex'; }
        function fecharModal() { document.getElementById('modal-adicionar').style.display = 'none'; }
        
        function abrirModalEditar(id) { 
            const filme = todosOsFilmes.find(f => f.id === id);
            if(!filme) return;
            
            document.getElementById('edit-id').value = filme.id;
            document.getElementById('edit-titulo').value = filme.titulo;
            document.getElementById('edit-diretor').value = filme.diretor;
            document.getElementById('edit-ano').value = filme.ano;
            document.getElementById('edit-imagem').value = filme.imagem || '';
            
            document.getElementById('modal-editar').style.display = 'flex'; 
        }
        function fecharModalEditar() { document.getElementById('modal-editar').style.display = 'none'; }

        verificarSessao();
    </script>
</body>
</html>
