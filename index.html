<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pokémon Filmes</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #f5f5f5, #e8e8e8);
            color: #222;
            min-height: 100vh;
        }

        header {
            background: linear-gradient(135deg, #e3350d, #ff6b35);
            color: white;
            padding: 40px 20px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        header h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }

        header p {
            font-size: 18px;
            opacity: 0.9;
        }

        main {
            width: 90%;
            max-width: 1200px;
            margin: 40px auto;
        }

        .titulo {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .titulo h2 {
            font-size: 28px;
        }

        .contador {
            background: #333;
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 14px;
        }

        #filmes {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
        }

        .card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.12);
            transition: transform 0.25s, box-shadow 0.25s;
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.2);
        }

        /* IMAGEM DO FILME */

        .card-topo {
            height: 320px;
            overflow: hidden;
            background: #eee;
        }

        .card-topo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.3s;
        }

        .card:hover .card-topo img {
            transform: scale(1.05);
        }

        .card-conteudo {
            padding: 22px;
        }

        .card h3 {
            color: #333;
            font-size: 20px;
            line-height: 1.4;
            margin-bottom: 18px;
        }

        .informacao {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            padding: 9px 0;
            border-bottom: 1px solid #eee;
            font-size: 15px;
        }

        .informacao:last-child {
            border-bottom: none;
        }

        .label {
            color: #777;
        }

        .valor {
            font-weight: bold;
            color: #333;
            text-align: right;
        }

        .id {
            display: inline-block;
            background: #333;
            color: white;
            padding: 4px 9px;
            border-radius: 12px;
            font-size: 12px;
        }

        .carregando {
            text-align: center;
            font-size: 18px;
            color: #777;
            padding: 50px;
            grid-column: 1 / -1;
        }

        .erro {
            background: #ffe5e5;
            color: #c62828;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            grid-column: 1 / -1;
        }

        footer {
            text-align: center;
            padding: 30px;
            margin-top: 50px;
            color: #777;
        }

        @media (max-width: 600px) {

            header h1 {
                font-size: 32px;
            }

            .titulo {
                flex-direction: column;
                gap: 10px;
                align-items: flex-start;
            }

            main {
                width: 92%;
            }

            .card-topo {
                height: 380px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>⚡ Pokémon Filmes</h1>
        <p>Catálogo de filmes disponíveis na API</p>
    </header>

    <main>

        <div class="titulo">

            <h2>🎬 Filmes</h2>

            <span class="contador" id="contador">
                Carregando...
            </span>

        </div>

        <div id="filmes">

            <div class="carregando">
                Carregando filmes...
            </div>

        </div>

    </main>

    <footer>
        API de Filmes Pokémon • localhost:3000
    </footer>


    <script>

        fetch("/filmes")

            .then(response => {

                if (!response.ok) {
                    throw new Error("Erro ao acessar a API");
                }

                return response.json();

            })

            .then(filmes => {

                const container =
                    document.getElementById("filmes");

                const contador =
                    document.getElementById("contador");

                container.innerHTML = "";

                contador.textContent =
                    `${filmes.length} filmes`;


                filmes.forEach(filme => {

                    const card =
                        document.createElement("div");

                    card.classList.add("card");


                    card.innerHTML = `

                        <div class="card-topo">

                            <img
                                src="${filme.imagem}"
                                alt="${filme.titulo}"
                            >

                        </div>


                        <div class="card-conteudo">

                            <h3>
                                ${filme.titulo}
                            </h3>


                            <div class="informacao">

                                <span class="label">
                                    ID
                                </span>

                                <span class="id">
                                    #${filme.id}
                                </span>

                            </div>


                            <div class="informacao">

                                <span class="label">
                                    Diretor
                                </span>

                                <span class="valor">
                                    ${filme.diretor}
                                </span>

                            </div>


                            <div class="informacao">

                                <span class="label">
                                    Ano
                                </span>

                                <span class="valor">
                                    ${filme.ano}
                                </span>

                            </div>

                        </div>

                    `;


                    container.appendChild(card);

                });

            })


            .catch(erro => {

                const container =
                    document.getElementById("filmes");


                container.innerHTML = `

                    <div class="erro">

                        ❌ Não foi possível carregar os filmes.

                        <br><br>

                        Verifique se o servidor está rodando em:

                        <br>

                        <strong>
                            http://localhost:3000
                        </strong>

                    </div>

                `;


                console.error(erro);

            });

    </script>

</body>
</html>
